name: Fork Build

# Manually build binaries and a multiarch Docker image, published to this
# fork's own GitHub Container Registry package (ghcr.io/<owner>/evcc) using
# the built-in GITHUB_TOKEN. Lets you build/publish images without depending
# on the upstream maintainer's /build command or upstream's Docker Hub org.
# Mirrors upstream's command-pr-build.yml, but triggered manually and using
# standard GitHub-hosted runners instead of Depot.

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Branch, tag or SHA to build (defaults to the branch this is run from)
                type: string
                default: ""
            target:
                description: Build target
                type: choice
                default: all
                options:
                    - all # binaries (amd64/arm64/arm) + multiarch docker
                    - amd # linux amd64 only
                    - arm # linux arm64 + arm/v6 only
                    - docker # multiarch docker image only, no binaries
            tag:
                description: Docker tag (image will be ghcr.io/<owner>/evcc:<tag>)
                type: string
                default: manual

permissions:
    contents: read

jobs:
    prep:
        name: Prepare
        runs-on: ubuntu-latest
        outputs:
            archs: ${{ steps.parse.outputs.archs }}
            platforms: ${{ steps.parse.outputs.platforms }}
            image: ${{ steps.parse.outputs.image }}
        steps:
            - name: Parse target
              id: parse
              env:
                  TARGET: ${{ inputs.target }}
              run: |
                  case "$TARGET" in
                    amd)    archs='["amd64"]';               platforms='linux/amd64' ;;
                    arm)    archs='["arm64","arm"]';         platforms='linux/arm64,linux/arm/v6' ;;
                    docker) archs='[]';                      platforms='linux/amd64,linux/arm64,linux/arm/v6' ;;
                    *)      archs='["amd64","arm64","arm"]'; platforms='linux/amd64,linux/arm64,linux/arm/v6' ;;
                  esac
                  echo "archs=$archs" >> "$GITHUB_OUTPUT"
                  echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
                  echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    binaries:
        name: Binaries
        needs: prep
        if: needs.prep.outputs.archs != '[]'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            matrix:
                arch: ${{ fromJSON(needs.prep.outputs.archs) }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.ref }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: ./.github/actions/build-toolchain
              with:
                  cache-scope: fork-build # isolated cache, cannot poison the nightly/main cache

            - name: Resolve SHA
              id: sha
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Build binary
              env:
                  CGO_ENABLED: 0
                  GOOS: linux
                  GOARCH: ${{ matrix.arch }}
                  GOARM: 6
                  SHA: ${{ steps.sha.outputs.sha }}
                  TAG: ${{ inputs.tag }}
              run: |
                  go build -trimpath -tags release \
                    -ldflags "-X github.com/evcc-io/evcc/util.Version=${TAG}-${SHA:0:7} -X github.com/evcc-io/evcc/util.Commit=${SHA:0:7} -s -w" \
                    -o "evcc-linux-${{ matrix.arch }}" .
                  gzip -9 "evcc-linux-${{ matrix.arch }}"

            - name: Upload binary
              uses: actions/upload-artifact@v7
              with:
                  name: evcc-${{ inputs.tag }}-linux-${{ matrix.arch }}
                  path: evcc-linux-${{ matrix.arch }}.gz
                  compression-level: 0 # already gzip'd, skip redundant zip compression
                  retention-days: 14

    docker:
        name: Docker
        needs: prep
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.ref }}
                  fetch-depth: 0
                  persist-credentials: false

            # GH-hosted runners are amd64 only; emulation is needed for the other platforms
            # (Depot builders used upstream have native multiarch, so they skip this)
            - name: Setup QEMU
              uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
              with:
                  platforms: arm64,arm

            - name: Login to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Buildx
              id: buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

            - name: Restore build cache
              uses: ./.github/actions/docker-cache
              with:
                  builder: ${{ steps.buildx.outputs.name }}
                  cache-scope: fork-build

            - name: Publish
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  platforms: ${{ needs.prep.outputs.platforms }}
                  push: true
                  tags: ${{ needs.prep.outputs.image }}:${{ inputs.tag }}
